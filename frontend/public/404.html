<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TalentMesh</title>
    <script>
      // GitHub Pages has no server-side routing, so it serves this file for
      // any unmatched path (e.g. a deep link like /TalentMesh/jobs/job-033
      // loaded directly, not navigated to from within the app). This encodes
      // the intended path into a query string and redirects to index.html,
      // which decodes it back via the inline script there and hands off to
      // React Router. Standard pattern: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep "/TalentMesh"
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
